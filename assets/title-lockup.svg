  <defs>
    <style>
      .cls-1 {
        fill: #cc171e;
        stroke: #e3bc3d;
        stroke-miterlimit: 10;
        /* SVG strokes are centred; Illustrator's stroke was aligned
           outside. paint-order draws the stroke behind the fill, which is
           what "outside" means, and the weight is doubled to compensate
           for the half that the fill now covers.  .76 outside == 1.52 here. */
        paint-order: stroke;
        stroke-width: 1.52px;
      }
    </style>
